# Tests on every push and pull request: the Go daemon/CLI and the deck UI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false # standard library only: nothing to cache
      - run: brew install tmux protobuf # tmux: daemon tests; protoc: the Deck Link drift check
      - name: vet and test
        working-directory: backend
        run: |
          go vet ./...
          go test -race ./...
      - name: Deck Link code matches link.proto
        working-directory: backend
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          PATH="$(go env GOPATH)/bin:$PATH" go generate ./internal/link
          git diff --exit-code -I '^// .protoc  ' -- internal/link/linkpb # the protoc version line may differ
      - name: cross-compile (targets the release matrix will grow into)
        working-directory: backend
        run: |
          for t in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/agentctl
          done

  flutter:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - name: deck UI package
        working-directory: clients/flutter/agents_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: menu bar app
        working-directory: clients/macos
        run: |
          flutter pub get
          flutter analyze
          flutter test

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tools (nanopb, PlatformIO)
        run: |
          sudo apt-get install -y --no-install-recommends protobuf-compiler >/dev/null # nanopb's generator runs protoc
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet nanopb==0.4.9.1 platformio
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: generated C matches link.proto
        run: firmware/deck-link/tools/generate.sh --check
      - name: host tests
        run: |
          make -C firmware/deck-link/test/host test
          for t in firmware/devices/*/tests/run.sh; do
            [ -x "$t" ] || continue
            echo "::group::$t"
            "$t"
            echo "::endgroup::"
          done
      - name: build every example and device
        run: |
          for d in firmware/deck-link/examples/*/ firmware/devices/*/; do
            [ -f "$d/platformio.ini" ] || continue
            echo "::group::$d"
            pio run -d "$d"
            echo "::endgroup::"
          done
