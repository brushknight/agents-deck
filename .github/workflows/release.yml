# Release builds. Push a tag (v0.1.0) and this creates the GitHub release; or
# publish a release from the GitHub UI and this fills it. Either way it
# builds the executables and the board firmware and attaches them, with
# SHA256SUMS.
#
# Today: macOS arm64 (agentctl + the menu bar app), and one firmware image
# per board (flashed at 0x0) with an ESP Web Tools manifest each and
# firmware-manifest.json listing them all. Linux amd64/arm64 and Windows
# join the matrix once those platforms are supported (see docs/releasing.md).
#
# Signing is optional: with the MACOS_* / APPLE_* secrets set, both are
# signed with your Developer ID and the app is notarized; without them they
# are ad-hoc signed (macOS will ask before opening them).
name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to (re)build and attach
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.6
  # pioarduino's PlatformIO Core (what pioarduino's platform is made for; it
  # builds PlatformIO's own espressif32 platform for the 2.0.17 boards too).
  PLATFORMIO_VERSION: 6.2.0
  ESPTOOL_VERSION: 5.6.0

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  macos-arm64:
    needs: meta
    runs-on: macos-14 # Apple Silicon
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      HAVE_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false # standard library only: nothing to cache
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: agentctl
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" -o ../dist/agentctl ./cmd/agentctl
          ../dist/agentctl version

      - name: menu bar app
        working-directory: clients/macos
        run: |
          flutter pub get
          flutter build macos --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          cp -R "build/macos/Build/Products/Release/agents deck.app" ../../dist/

      - name: signing keychain
        if: env.HAVE_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          pw="$(openssl rand -hex 16)"
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: sign
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ "$HAVE_CERT" = "true" ]; then
            id="$IDENTITY"; opts=(--options runtime --timestamp)
          else
            id="-"; opts=()
            echo "::warning::no MACOS_CERT_P12 secret: ad-hoc signing (macOS will warn on first open)"
          fi
          codesign --force "${opts[@]}" -s "$id" -i dev.agents-deck.agentctl dist/agentctl
          codesign --force --deep "${opts[@]}" -s "$id" \
            --entitlements clients/macos/macos/Runner/Release.entitlements "dist/agents deck.app"
          codesign --verify --strict --verbose=2 "dist/agents deck.app"

      - name: notarize
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          cd dist
          ditto -c -k --keepParent "agents deck.app" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "agents deck.app"
          rm notarize.zip
          # A bare binary can't be stapled; notarizing it registers the ticket online.
          zip -q agentctl.zip agentctl
          xcrun notarytool submit agentctl.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          rm agentctl.zip

      - name: package
        run: |
          cd dist
          tar -czf "agentctl_${VERSION}_darwin_arm64.tar.gz" agentctl
          ditto -c -k --keepParent "agents deck.app" "agents-deck_${VERSION}_macos_arm64.zip"
          rm -rf agentctl "agents deck.app"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: dist/*

  # One merged image per board, built with the PlatformIO CLI in a pinned
  # container. The env is each board's recommended firmware (docs/flashing.md):
  # idf5 (pioarduino, arduino-esp32 3.x) where it has Wi-Fi, 2.0.17 otherwise.
  # idf5 projects keep their tools in a PlatformIO home of their own, as on a
  # Mac, with the SCons fix from docs/flashing.md applied before the build.
  # Each board has its own cache, keyed on the PlatformIO version and its
  # platformio.ini.
  firmware:
    needs: meta
    runs-on: ubuntu-24.04
    container: python:3.12.15-slim-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: waveshare-touch-lcd-28c
            name: Waveshare ESP32-S3-Touch-LCD-2.8C
            project: firmware/devices/waveshare-touch-lcd-28c/idf5
            env: idf5
            home: .platformio-pioarduino
          - board: waveshare-touch-lcd-21
            name: Waveshare ESP32-S3-Touch-LCD-2.1
            project: firmware/devices/waveshare-touch-lcd-21/idf5
            env: idf5
            home: .platformio-pioarduino
          - board: waveshare-touch-amoled-18
            name: Waveshare ESP32-S3-Touch-AMOLED-1.8
            project: firmware/devices/waveshare-touch-amoled-18/idf5
            env: idf5
            home: .platformio-pioarduino
          - board: lilygo-t4-s3
            name: LilyGO T4-S3
            project: firmware/devices/lilygo-t4-s3/idf5
            env: idf5
            home: .platformio-pioarduino
          - board: waveshare-touch-lcd-4 # 2.0.17 until its idf5 build is out of experimental
            name: Waveshare ESP32-S3-Touch-LCD-4
            project: firmware/devices/waveshare-touch-lcd-4
            env: waveshare-touch-lcd-4
            home: .platformio
          - board: waveshare-lcd-147 # no Wi-Fi: 2.0.17 is its only firmware
            name: Waveshare ESP32-S3-LCD-1.47B
            project: firmware/devices/waveshare-lcd-147
            env: waveshare-s3-147b
            home: .platformio
          - board: lilygo-t-display-s3
            name: LilyGO T-Display-S3
            project: firmware/devices/lilygo-t-display-s3/idf5
            env: idf5
            home: .platformio-pioarduino
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PLATFORMIO_CORE_DIR: /github/home/${{ matrix.home }}
    steps:
      - name: system packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git zstd >/dev/null
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/cache@v6
        with:
          path: |
            ${{ env.PLATFORMIO_CORE_DIR }}
            /github/home/.cache/pip
          key: pio-${{ env.PLATFORMIO_VERSION }}-${{ matrix.board }}-${{ matrix.env }}-${{ hashFiles(format('{0}/platformio.ini', matrix.project)) }}
      - name: PlatformIO and esptool
        run: |
          pip install --quiet "https://github.com/pioarduino/platformio-core/archive/refs/tags/v$PLATFORMIO_VERSION.zip" \
            "esptool==$ESPTOOL_VERSION"
          pio --version
      - name: "pioarduino: one SCons for Core and the platform"
        if: matrix.home == '.platformio-pioarduino'
        run: .github/scripts/pioarduino-scons.sh "${{ matrix.project }}" "${{ matrix.env }}"
      - name: build and merge
        run: |
          python .github/scripts/firmware_release.py build --board "${{ matrix.board }}" \
            --name "${{ matrix.name }}" --dir "${{ matrix.project }}" --env "${{ matrix.env }}" \
            --version "$VERSION" --out dist
          python -m esptool --chip esp32s3 image-info "dist/agents-deck-${{ matrix.board }}-$VERSION.bin"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.board }}
          path: dist/*

  firmware-index:
    needs: [meta, firmware]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true
      - name: firmware-manifest.json
        run: python3 .github/scripts/firmware_release.py index --version "${{ needs.meta.outputs.version }}" --dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: dist/*

  publish:
    needs: [meta, macos-arm64, firmware-index]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: macos-arm64
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: release
        run: |
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --generate-notes --title "agents deck $TAG"
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
