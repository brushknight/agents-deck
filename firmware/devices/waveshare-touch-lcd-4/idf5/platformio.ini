; waveshare-touch-lcd-4 on arduino-esp32 3.x / ESP-IDF 5 (pioarduino): the firmware to flash.
; The same sources as the main build (../platformio.ini, arduino-esp32 2.0.17,
; USB only), plus Wi-Fi to the deck over TLS 1.3.
;
;   pio run -d firmware/devices/waveshare-touch-lcd-4/idf5 -e idf5 -t upload
;   pio run -d firmware/devices/waveshare-touch-lcd-4/idf5 -e idf5-debug -t upload
;
; pioarduino and PlatformIO's own espressif32 platform share package names
; (framework-arduinoespressif32) and clash in one PlatformIO home, so this
; project keeps its platform and toolchains in a home of its own.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; The board and the version this firmware reports (AGENTS_DECK_VERSION from the release).
extra_scripts = pre:../../../panel-core/tools/build_info.py
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Wi-Fi to the deck needs TLS 1.3 (the deck's network listener accepts nothing
; else), which the prebuilt arduino-esp32 libraries leave out: pioarduino
; rebuilds them with it (its first build takes a while longer). TLS takes its
; buffers from PSRAM: with Bluetooth on, internal RAM is too short for a handshake.
;
; The picture: with the panel's DMA scanning the framebuffer straight from
; PSRAM, it jumped sideways at times while the board connected to the deck,
; most likely because the DMA ran short when Wi-Fi, a TLS handshake and the
; drawing all used PSRAM at once, or flash was written (NVS: Wi-Fi, the
; certificate), which holds up PSRAM while the code runs from flash. So, as
; on the round boards (still to be confirmed on this board): the panel scans two
; bounce buffers of ten lines in internal RAM (LCD4_BOUNCE_PX), which the LCD
; interrupt refills from the framebuffer in turn. The code runs from PSRAM,
; so flash writes no longer stop the cache (and with it the refills), and the
; interrupt runs from IRAM. RESTART_IN_VSYNC is off: with it on (the prebuilt
; libraries' setting) the driver never recounts which bounce buffer is which,
; so one late refill puts every later one into the buffer being scanned,
; which is the horizontal lines an earlier test of the bounce buffer showed.
; With it off, the driver counts each frame's refills and restarts the scan at
; the next VSYNC when one was missed. PSRAM is read in 64-byte cache lines.
; Every display setting is named here: pioarduino can start from the Arduino
; libraries another project built in the same PlatformIO home, so a setting
; left out may or may not be in the build.
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
    CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    '# CONFIG_LCD_RGB_RESTART_IN_VSYNC is not set'
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -DLCD4_BOUNCE_PX=4800
build_src_flags = -Wall -Wextra
; Arduino_GFX 1.5.0 doesn't build on arduino-esp32 3.3 (its hardware SPI
; buses); 1.6 does.
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9

; The firmware with one-line notes on the USB port (link, Wi-Fi, memory; the deck ignores text).
[env:idf5-debug]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DPANEL_DEBUG
