; LilyGO T-Display-S3 (and T-Display-S3 Touch): an agents deck panel over Deck
; Link (USB serial) that answers prompts from its touch screen and buttons.
; This is the arduino-esp32 2.0.17 build, USB only; idf5/ adds Wi-Fi (the one to flash).
;
; The empty screen's clock is UTC unless the build sets a time zone, e.g.
;   PLATFORMIO_BUILD_FLAGS='-DTDS3_TZ=\"CET-1CEST,M3.5.0,M10.5.0/3\"' pio run -d … -t upload
[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB, not a UART bridge. Toggling DTR/RTS
; would drop the board into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Serial is the chip's own USB (CDC on boot, through the USB-Serial-JTAG peripheral):
; the port Deck Link runs on, and the one PlatformIO flashes through.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

; The same, with how long each frame takes (draw + push) in a corner.
[env:fps]
extends = env:lilygo-t-display-s3
build_flags = ${env:lilygo-t-display-s3.build_flags} -DTDS3_SHOW_FPS=1
