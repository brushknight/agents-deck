; t4s3-panel: the LilyGo T4-S3 (2.41" AMOLED, 450x600, touch) as a Deck Link
; board. ESP-IDF on FreeRTOS, LVGL 9 for the screen.
;
; The Deck Link kit is an ESP-IDF component (EXTRA_COMPONENT_DIRS in
; CMakeLists.txt); LVGL comes from the ESP-IDF component registry
; (src/idf_component.yml). Settings are in sdkconfig.defaults.

[platformio]
default_envs = t4s3

[env:t4s3]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = espidf
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
; esptool 4.8: older ones lose the board mid-upload over the S3's own USB
platform_packages = platformio/tool-esptoolpy @ 1.40801.0
extra_scripts = pre:esptool_deps.py

; For development: the USB port also takes "!snap" (dumps the screen),
; "!tap x y" and "!drag x1 y1 x2 y2" (see src/debug.h). Not for daily use.
[env:t4s3-debug]
extends = env:t4s3
build_flags = -DPANEL_DEBUG
