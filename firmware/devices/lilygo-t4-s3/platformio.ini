; LilyGO T4-S3 (2.41" RM690B0 AMOLED, 450x600, CST226SE touch): the deck with the 1.8" AMOLED's UI,
; over Deck Link on USB. arduino-esp32 2.0.17: USB only (no TLS 1.3, so no Wi-Fi); idf5/ is the
; firmware to flash (USB and Wi-Fi).
[platformio]
default_envs = lilygo-t4-s3

[env:lilygo-t4-s3]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = idf5/default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

; Bring-up: the same firmware with one-line notes on the USB port (the deck ignores text).
[env:debug]
extends = env:lilygo-t4-s3
build_flags = ${env:lilygo-t4-s3.build_flags} -DPANEL_DEBUG
