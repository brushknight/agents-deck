; lilygo-t4-s3 on arduino-esp32 3.x / ESP-IDF 5 (pioarduino): the firmware to flash.
; The same sources as the main build (../platformio.ini, arduino-esp32 2.0.17,
; USB only), plus Wi-Fi to the deck over TLS 1.3.
;
;   pio run -d firmware/devices/lilygo-t4-s3/idf5 -e idf5 -t upload
;   pio run -d firmware/devices/lilygo-t4-s3/idf5 -e idf5-debug -t upload
;
; pioarduino and PlatformIO's own espressif32 platform share package names
; (framework-arduinoespressif32) and clash in one PlatformIO home, so this
; project keeps its platform and toolchains in a home of its own.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; Wi-Fi to the deck needs TLS 1.3 (the deck's network listener accepts nothing
; else), which the prebuilt arduino-esp32 libraries leave out: pioarduino
; rebuilds them with it (its first build takes a while longer).
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
build_src_flags = -Wall -Wextra
; Arduino_GFX 1.5.0 doesn't build on arduino-esp32 3.3 (its hardware SPI
; buses); 1.6 does.
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9

; The firmware with one-line notes on the USB port (link, Wi-Fi, memory; the deck ignores text).
[env:idf5-debug]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DPANEL_DEBUG

; LilyGO's own orientation (the earlier firmware's default t4s3 build), for a panel not turned over.
[env:idf5-upright]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DT4S3_UPRIGHT
