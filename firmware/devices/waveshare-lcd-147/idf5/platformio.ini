; waveshare-lcd-147 on arduino-esp32 3.x / ESP-IDF 5 (pioarduino): the firmware to flash.
; The same sources as the 2.0.17 build (../platformio.ini). Still a read-only
; panel on USB: this board's firmware has no Wi-Fi or Bluetooth.
;
;   pio run -d firmware/devices/waveshare-lcd-147/idf5 -e idf5 -t upload
;
; pioarduino and PlatformIO's own espressif32 platform share package names
; (framework-arduinoespressif32) and clash in one PlatformIO home, so this
; project keeps its platform and toolchains in a home of its own.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
; The board and the version this firmware reports (AGENTS_DECK_VERSION from the release).
extra_scripts = pre:../../../panel-core/tools/build_info.py
monitor_speed = 115200
; The link is the chip's own USB, not a UART bridge. Toggling DTR/RTS
; would drop the board into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9
