; Waveshare ESP32-S3-Touch-LCD-2.8C (480x480 round ST7701 RGB, GT911 touch): Orbit, every agent on a ring, over Deck Link (USB serial)
[platformio]
default_envs = waveshare-touch-lcd-28c

[env:waveshare-touch-lcd-28c]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

; Bring-up: the same firmware with one-line notes on the USB port (the deck ignores text).
[env:debug]
extends = env:waveshare-touch-lcd-28c
build_flags = ${env:waveshare-touch-lcd-28c.build_flags} -DPANEL_DEBUG
