; Freenove ESP32-S3 Display 2.8" (FNK0104B: 240x320 ILI9341 on SPI, FT6336U touch): the deck as a
; scrolling list of tiles, over Deck Link on USB. arduino-esp32 2.0.17: USB only (no TLS 1.3, so no
; Wi-Fi); idf5/ is the firmware to flash (USB and Wi-Fi).
;
; Settings (build_flags):
;   FREENOVE28_TURNED         the picture and touch turned 180 degrees (USB-C at the top)
;   FREENOVE28_NOT_INVERTED   for a panel that shows the colours inverted (white background)
[platformio]
default_envs = freenove-s3-28

[env:freenove-s3-28]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = idf5/default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

; Bring-up: the same firmware with one-line notes on the USB port (the deck ignores text).
[env:debug]
extends = env:freenove-s3-28
build_flags = ${env:freenove-s3-28.build_flags} -DPANEL_DEBUG
