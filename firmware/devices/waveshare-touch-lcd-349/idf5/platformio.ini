; waveshare-touch-lcd-349 on arduino-esp32 3.x (pioarduino): USB and Wi-Fi with TLS 1.3. The firmware to flash.
; pioarduino clashes with PlatformIO's own espressif32 in one home, so this project has its own.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
; The deck's network listener takes only TLS 1.3, which the prebuilt libraries
; leave out: pioarduino rebuilds them with it.
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DSTRIP_ROTATION=90
build_src_flags = -Wall -Wextra
; Arduino_GFX 1.5.0 doesn't build on arduino-esp32 3.3 (its hardware SPI
; buses); 1.6 does.
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9

; The firmware with one-line notes on the USB port (link, Wi-Fi, memory; the deck ignores text).
[env:idf5-debug]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DPANEL_DEBUG

; The hardware self-test on this build: rotation, touch, backlight, timings.
[env:idf5-selftest]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DSTRIP_SELFTEST
