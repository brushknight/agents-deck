; Waveshare ESP32-S3-Touch-LCD-3.49: the deck on a landscape strip, USB only (2.0.17); idf5/ adds Wi-Fi.
; Envs and settings (STRIP_ROTATION): see README.md.
[platformio]
default_envs = waveshare-touch-lcd-349

[env:waveshare-touch-lcd-349]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DSTRIP_ROTATION=90
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

[env:debug]
extends = env:waveshare-touch-lcd-349
build_flags = ${env:waveshare-touch-lcd-349.build_flags} -DPANEL_DEBUG

[env:selftest]
extends = env:waveshare-touch-lcd-349
build_flags = ${env:waveshare-touch-lcd-349.build_flags} -DSTRIP_SELFTEST
