; Optional SenseCAP Wi-Fi build. Experimental until physical acceptance.
; Separate PlatformIO home avoids Arduino 2.x/3.x package conflicts.
[platformio]
src_dir = ../src
core_dir = ~/.platformio-pioarduino
default_envs = idf5

[env:idf5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:../tools/build_version.py
monitor_speed = 115200
; CH340 DTR/RTS control reset and boot mode: leave them deasserted.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
upload_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
; Wi-Fi to the deck needs TLS 1.3 (the deck's network listener accepts nothing
; else), which the prebuilt arduino-esp32 libraries leave out: pioarduino
; rebuilds them with it (its first build takes a while longer).
custom_sdkconfig =
    CONFIG_MBEDTLS_SSL_PROTO_TLS1_3=y
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -DSENSECAP_BOUNCE_PX=0
build_src_flags = -Wall -Wextra
; Arduino_GFX 1.5.0 doesn't build on arduino-esp32 3.3 (its hardware SPI
; buses); 1.6 does.
lib_deps =
    symlink://../../../deck-link
    symlink://../../../panel-core
    moononournation/GFX Library for Arduino@1.6.9

; The firmware with one-line notes on the USB port (link, Wi-Fi, memory; the deck ignores text).
[env:idf5-debug]
extends = env:idf5
build_flags = ${env:idf5.build_flags} -DPANEL_DEBUG
