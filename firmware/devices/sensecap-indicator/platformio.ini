; Seeed SenseCAP Indicator (D1, D1S, D1L, D1Pro; 480x480 ST7701S RGB, FT6336 touch): the deck as a 4x4 grid, over Deck Link
; The ESP32-S3's USB-C port goes through a CH340 USB-UART bridge, so the link is UART0 (/dev/cu.usbserial-*),
; not the chip's own USB. The RP2040 on the board is left alone.
[platformio]
default_envs = sensecap-indicator

[env:sensecap-indicator]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The CH340's DTR/RTS drive EN and IO0 (esptool's auto-reset): leave both alone while watching.
monitor_rts = 0
monitor_dtr = 0
upload_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DPANEL_LAST_PROMPT=160
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

; Bring-up: the same firmware with one-line notes on the serial port (the deck ignores text).
[env:debug]
extends = env:sensecap-indicator
build_flags = ${env:sensecap-indicator.build_flags} -DPANEL_DEBUG

; Standalone physical touch test. No agent commands or Deck Link connection.
[env:touch-diagnostic]
extends = env:sensecap-indicator
build_flags = ${env:sensecap-indicator.build_flags} -DSENSECAP_TOUCH_DIAGNOSTIC
