; Waveshare ESP32-S3-Touch-LCD-2.1 (480x480 round ST7701 RGB, CST820 touch): Dial, one agent at a time, over Deck Link (USB serial).
;
; Envs (pio run -d firmware/devices/waveshare-touch-lcd-21 -e <env> -t upload):
;   waveshare-touch-lcd-21   the firmware (arduino-esp32 2.0.17, like the other panels)
;   debug                    the same with one-line notes on the USB port (the deck ignores text)
;   selftest                 the hardware self-test, no Deck Link: colours, text, touch, buzzer, backlight
;
; The fallback if the picture drifts or tears, arduino-esp32 3.x on ESP-IDF 5 with
; an RGB bounce buffer, is its own project in idf5/ (envs idf5, idf5-selftest).
;
; Settings (build_flags):
;   ROUND_ROTATION   0 | 90 | 180 | 270: the image turned clockwise, the touch with it
;   ROUND_PCLK_HZ    the RGB pixel clock
[platformio]
default_envs = waveshare-touch-lcd-21

[env:waveshare-touch-lcd-21]
platform = espressif32 @ 6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The link is the chip's own USB. Toggling DTR/RTS would reset it into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DPANEL_MAX_AGENTS=64
    -DPANEL_OPTION_LABEL=96
    -DROUND_ROTATION=0
    -DROUND_PCLK_HZ=16000000
    -std=gnu++17
build_unflags =
    -std=gnu++11
build_src_flags = -Wall -Wextra
lib_deps =
    symlink://../../deck-link
    symlink://../../panel-core
    moononournation/GFX Library for Arduino@1.5.0

[env:debug]
extends = env:waveshare-touch-lcd-21
build_flags = ${env:waveshare-touch-lcd-21.build_flags} -DPANEL_DEBUG

[env:selftest]
extends = env:waveshare-touch-lcd-21
build_flags = ${env:waveshare-touch-lcd-21.build_flags} -DROUND_SELFTEST
