; Waveshare ESP32-S3-LCD-1.47B — read-only panel for the agents-deck daemon
[platformio]
default_envs = waveshare-s3-147b

[env:waveshare-s3-147b]
platform = espressif32@7.1.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The console is the chip's own USB, not a UART bridge. Toggling DTR/RTS
; would drop the board into the bootloader.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -std=gnu++17
build_unflags =
    -std=gnu++11
lib_deps =
    moononournation/GFX Library for Arduino@1.5.0
    bblanchon/ArduinoJson@6.21.5
