// Deck Link v1: the agents deck over USB serial, for ESP32 boards and the
// like. The single source of truth for the Go daemon (protoc-gen-go) and the
// firmware kit (nanopb). docs/link/protocol.md explains framing, the
// handshake and every message; link.options sets the size limits both sides
// use (the deck clips longer text to them).
//
// Every message travels in a Frame. The board starts with Hello; the deck
// answers Welcome. Requests from the board carry a seq the deck echoes in its
// Result (or its typed reply); events from the deck have seq 0.
syntax = "proto3";

package agentsdeck.link.v1;

option go_package = "github.com/brushknight/agents-deck/backend/internal/link/linkpb";

message Frame {
  uint32 seq = 1;
  oneof body {
    // Handshake and liveness.
    Hello hello = 10;              // board → deck, first frame
    Welcome welcome = 11;          // deck → board; again when approval or scope changes
    Ping ping = 12;                // either way
    Pong pong = 13;                // the answer to a Ping, same seq
    Subscribe subscribe = 14;      // board → deck: which agents and fields to send

    // State, deck → board.
    SnapshotBegin snapshot_begin = 20;  // a full state follows: one AgentChanged per agent…
    AgentChanged agent_changed = 21;    // …and later, one per agent that changed
    AgentRemoved agent_removed = 22;
    SnapshotEnd snapshot_end = 23;
    Magic magic = 24;                   // its part in the magic trick: after a SnapshotEnd when it has one, and when it changes (before the agent changes that follow)
    Limits limits = 25;                 // the accounts' usage limits (State.limits), with FIELDS_LIMITS: after a SnapshotEnd when there are any, and when they change

    // Commands, board → deck: one per web API endpoint (docs/protocol.md).
    Answer answer = 30;            // POST /v1/agents/{id}/answer
    Focus focus = 31;              // POST /v1/agents/{id}/focus
    Interrupt interrupt = 32;      // POST /v1/agents/{id}/interrupt
    Dismiss dismiss = 33;          // POST /v1/agents/{id}/dismiss
    Move move = 34;                // POST /v1/agents/{id}/move
    Order order = 35;              // POST /v1/order
    Resume resume = 36;            // POST /v1/agents/{id}/resume
    Restore restore = 37;          // POST /v1/restore
    SetHat set_hat = 38;           // POST /v1/agents/{id}/hat, POST /v1/hats
    ListHats list_hats = 39;       // GET /v1/hats
    ListLive list_live = 40;       // GET /v1/live
    AddLive add_live = 41;         // POST /v1/live/{session}/add
    GetState get_state = 42;       // GET /v1/state: resend the snapshot
    Handoff handoff = 43;          // POST /v1/agents/{id}/handoff
    ListAccounts list_accounts = 44;  // GET /v1/accounts
    MoveAttention move_attention = 45;  // POST /v1/agents/{id}/attention
    Stash stash = 46;              // POST /v1/stash
    MagicView magic_view = 47;     // POST /v1/magic/view
    SendPrompt send_prompt = 48;   // POST /v1/agents/{id}/prompt
    Queue queue = 49;              // GET /v1/agents/{id}/queue, POST /v1/agents/{id}/queue/{qid}/cancel

    // Replies, deck → board, with the request's seq.
    Result result = 50;            // every command without a typed reply
    HatList hat_list = 51;         // reply to ListHats
    LiveSessions live_sessions = 52;  // reply to ListLive
    RestoreResult restore_result = 53;  // reply to Restore
    AccountList account_list = 54;  // reply to ListAccounts
    QueueList queue_list = 55;     // reply to Queue (listing)

    // Pairing and Wi-Fi (docs/link/protocol.md, "Pairing and Wi-Fi"). Not
    // web API commands: they set up the board itself.
    CertRequest cert_request = 60;  // board → deck, over USB serial only: a certificate for my own key
    CertIssued cert_issued = 61;    // deck → board: the reply to CertRequest (or a Result on failure)
    WifiConfig wifi_config = 62;    // deck → board, over USB serial only: join this network; the board answers with a Result
    NetStatus net_status = 63;      // board → deck: how it is connected, after each Welcome and whenever that changes

    // Firmware updates over Wi-Fi (docs/link/protocol.md, "Firmware updates
    // over Wi-Fi"). Board management, not web API commands: the board
    // downloads the image with GET /v1/firmware/{board}/{version}.
    FirmwareOffer firmware_offer = 64;    // deck → board, over Wi-Fi only: a new firmware to download
    FirmwareStatus firmware_status = 65;  // board → deck: how the update is going

    // Which way the board should reach the deck (docs/link/protocol.md,
    // "Bluetooth"). Board management, not a web API command.
    LinkConfig link_config = 66;  // deck → board, any transport: the uplink preference; the board answers with a Result

    // More commands, board → deck, once fields 30..49 were taken: one per
    // web API endpoint, like those.
    HatchPet hatch_pet = 70;      // POST /v1/agents/{id}/pet/hatch
  }
}

// ---- handshake -----------------------------------------------------------

message Hello {
  uint32 protocol = 1;       // 1
  string board_id = 2;       // stable and unique: the MAC or USB serial number
  string type = 3;           // what kind of device, e.g. "oled-tile"
  string firmware = 4;       // its firmware version, e.g. "1.2.0"
  Display display = 5;       // absent: no screen
  repeated Input inputs = 6; // what a person can press or turn
  uint32 max_frame = 7;      // the largest frame it accepts (bytes, ≥ 512); 0 = 4096
}

message Display {
  uint32 width = 1;
  uint32 height = 2;
  bool color = 3;
}

enum Input {
  INPUT_UNSPECIFIED = 0;
  INPUT_BUTTON = 1;
  INPUT_ENCODER = 2;
  INPUT_TOUCH = 3;
  INPUT_KNOB = 4;  // a motorized/haptic knob
  INPUT_MOTION = 5;  // a motion sensor: knocks and shakes (it can receive the magic trick)
}

message Welcome {
  uint32 protocol = 1;        // 1
  string server_name = 2;     // the Mac's name
  string server_version = 3;  // agentctl version
  string device_name = 4;     // the board's name on the deck (agentctl devices)
  Scope scope = 5;
  bool approved = 6;          // false: waiting for `agentctl devices approve`; nothing else is sent until then
  string cert_serial = 7;     // the board's current certificate (CertIssued.cert_serial), "" for none:
                              // a board that holds another one asks again (CertRequest)
}

enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_VIEW = 1;   // state only
  SCOPE_ACT = 2;    // also answer, focus, interrupt, move, order, hats
  SCOPE_ADMIN = 3;  // also dismiss, resume, handoff, restore, live sessions
}

message Ping {
  uint64 time_ms = 1;  // sender's clock, echoed in the Pong
}

message Pong {
  uint64 time_ms = 1;
}

// Which agents and which of their fields the board wants. Sending it again
// replaces the previous one and triggers a fresh snapshot.
message Subscribe {
  uint32 first_slot = 1;  // board positions first_slot … first_slot+slot_count-1
  uint32 slot_count = 2;  // 0 = every agent
  uint32 fields = 3;      // FieldGroup bits; 0 = TILE
}

// Bits of Subscribe.fields. id and slot are always sent.
enum FieldGroup {
  FIELDS_NONE = 0;
  FIELDS_TILE = 1;       // title, tool, status, status_since, folder, context, unseen, lost, focused, external, app, hat, account, activity.tool, subagent_count, attention_slot, queued, slowed, slowed_by_you, project, pet, out_until
  FIELDS_CARD = 2;       // ai_title, cwd, branch, model, model_label, effort, activity.detail, last_prompt, last_answer, last_answer_at, error, resumable, attached, subagents, started_at, updated_at, last_active, project_folder
  FIELDS_PROMPT = 4;     // waiting
  FIELDS_NUMBERS = 8;    // tokens, cost_usd, turns, cpu
  FIELDS_LIMITS = 16;    // not an agent field: the board also gets Limits frames
}

// ---- state ---------------------------------------------------------------

message SnapshotBegin {
  Server server = 1;
  uint32 agent_count = 2;  // agents on the whole deck (not just the subscribed slots)
}

message SnapshotEnd {}

message Server {
  string name = 1;
  string version = 2;
  int64 time_ms = 3;
}

message AgentChanged {
  Agent agent = 1;  // complete for the subscribed field groups
}

message AgentRemoved {
  string id = 1;
}

enum Tool {
  TOOL_UNSPECIFIED = 0;
  TOOL_CLAUDE = 1;
  TOOL_CODEX = 2;
  TOOL_GEMINI = 3;
  TOOL_SHELL = 4;
  TOOL_OPENCODE = 5;
  TOOL_SIM = 6;
}

enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_STARTING = 1;
  STATUS_RUNNING = 2;
  STATUS_WAITING = 3;   // blocked on you: see Agent.waiting
  STATUS_IDLE = 4;
  STATUS_ERROR = 5;
  STATUS_EXITED = 6;
}

// Agent mirrors the JSON Agent of docs/protocol.md field for field (times as
// Unix milliseconds); a CI test keeps them in step.
message Agent {
  string id = 1;
  uint32 slot = 2;
  string title = 3;
  string ai_title = 4;
  Tool tool = 5;
  Status status = 6;
  int64 status_since_ms = 7;
  string cwd = 8;
  string folder = 9;
  string branch = 10;
  string model = 11;
  string model_label = 12;
  string effort = 13;
  Activity activity = 14;
  string last_prompt = 15;
  Prompt waiting = 16;
  string error = 17;          // the error message, when status is ERROR
  Tokens tokens = 18;
  Context context = 19;
  double cost_usd = 20;
  uint32 turns = 21;
  bool focused = 22;
  bool attached = 23;
  bool resumable = 24;
  bool lost = 25;
  bool unseen = 26;
  bool external = 27;
  Hat hat = 28;
  repeated Subagent subagents = 29;
  uint32 subagent_count = 30;  // len(subagents), sent with TILE so a small board can show it
  int64 started_at_ms = 31;
  int64 updated_at_ms = 32;
  string app = 33;             // the app it runs in when not agentctl's: "orca", "herdr", "cmux"
  Account account = 34;  // the Claude account it runs in; unset while only one is set up
  int64 last_active_ms = 35;  // its latest message sent or received; 0 = not known yet
  uint32 attention_slot = 36;  // its spot on the "Needs you" grid, 1..16 (4 x 4, by rows); 0 = not there
  uint32 queued = 37;          // prompts waiting to be typed in once its turn ends (SendPrompt with SEND_QUEUE)
  bool slowed = 38;            // in background mode while the computer is busy (the CPU guard; macOS)
  float cpu = 39;              // percent of the whole computer, only while it is busy; 0 otherwise
  bool slowed_by_you = 40;     // slowed with Slow it, not by the guard's own pick
  Project project = 41;        // the project its working folder is in; unset for none
  string project_folder = 42;  // the project folder it matched, in full; "" for none
  Pet pet = 43;                // its pet; unset while Agent pets is off
  int64 out_until_ms = 44;     // its account (or its model) is out of usage until then; 0 = not out
  string last_answer = 45;       // its reply that ended its latest finished turn, as plain text
  int64 last_answer_at_ms = 46;  // when it gave that reply; 0 = no answer yet
}

message Activity {
  string tool = 1;
  string detail = 2;
}

message Prompt {
  string id = 1;      // send it back in Answer
  PromptKind kind = 2;
  string title = 3;
  string detail = 4;
  string context = 5;
  repeated Option options = 6;  // empty for INPUT: answer in the terminal
}

enum PromptKind {
  PROMPT_UNSPECIFIED = 0;
  PROMPT_PERMISSION = 1;
  PROMPT_QUESTION = 2;
  PROMPT_INPUT = 3;
}

message Option {
  string key = 1;
  string label = 2;
  bool primary = 3;
  bool selected = 4;  // ticked: a pick-any question's answer so far
}

message Tokens {
  int64 input = 1;
  int64 output = 2;
  int64 cache_read = 3;
  int64 cache_write = 4;
}

message Context {
  int64 used = 1;
  int64 window = 2;
}

message Hat {
  string shape = 1;
  string color = 2;
  bool automatic = 3;  // picked from the folder, not by hand (JSON API: "auto")
}

// A Claude Code account (its own login and usage): a name and a hat colour.
message Account {
  string name = 1;
  string color = 2;
}

// An agent's pet: it eats the agent's input and output tokens and grows.
message Pet {
  string name = 1;          // "" until it hatches
  string stage = 2;         // egg, baby, kid, grown, strong, mighty, legend
  uint32 level = 3;         // 0 while an egg; never goes down
  int64 ate = 4;            // tokens eaten, all time
  int64 next_at = 5;        // ate that reaches the next level
  uint32 hearts = 6;        // 0..4
  string mood = 7;          // fed, hungry, weak, asleep (hibernating)
  int64 hatched_at_ms = 8;  // 0 while an egg
  bool ready = 9;           // an egg that has eaten enough and waits to be seen hatching (HatchPet)
  int64 level_from = 10;    // ate where the current level started (0 for an egg), for progress bars
  Hat hat = 11;             // its mystery hat (shape and color only); unset until it is a kid (level 5)
}

message Subagent {
  string id = 1;
  string title = 2;
  string type = 3;
  string tool = 4;
}

// ---- commands ------------------------------------------------------------

message Answer {
  string agent_id = 1;
  string prompt_id = 2;  // Agent.waiting.id; a stale one gets 409
  string key = 3;        // one of its options' keys
}

message Focus { string agent_id = 1; }
message Interrupt { string agent_id = 1; }

// SendPrompt types a task into the agent's session and presses Enter. text
// is at most 383 bytes (link.options), so the whole frame fits a board's
// smallest frame (512 bytes); the web API takes up to 4000.
//
// mode SEND_QUEUE keeps the prompt while the agent works or waits on a
// question and types it in when its turn ends (one queued prompt per turn);
// the Result is 200 when it went in at once, 202 when it was queued.
message SendPrompt {
  string agent_id = 1;
  string text = 2;
  bool interrupt = 3;  // the agent is working: press Esc first, then type (same as SEND_INTERRUPT)
  SendMode mode = 4;
  bool front = 5;      // SEND_QUEUE: go before the prompts queued earlier
}

enum SendMode {
  SEND_NOW = 0;        // only when the agent is idle (409 otherwise), unless interrupt is set
  SEND_INTERRUPT = 1;  // stop its turn (Esc), then type
  SEND_QUEUE = 2;      // when its turn ends
  SEND_TYPE = 3;       // typed in now, also while it works: the tool's own queue takes it (refused while it asks a question)
}

// Queue lists the prompts queued for an agent (the deck answers QueueList),
// or, with cancel_id, takes one back (the deck answers a Result: 204, or 404
// when it was sent or cancelled already).
message Queue {
  string agent_id = 1;
  string cancel_id = 2;  // QueuedPrompt.id
}
message Dismiss { string agent_id = 1; }
message Resume { string agent_id = 1; }
message HatchPet { string agent_id = 1; }  // hatch its pet's egg once it is ready (Pet.ready); Result 409 if it isn't

message Move {
  string agent_id = 1;
  uint32 slot = 2;  // 0…255
}

message Order {
  repeated string agent_ids = 1;
}

// The magic trick (docs/features.md): with it switched on in the deck's
// settings, a knock on the receiver (a board with a motion sensor) takes the
// agents the giver (any screen) shows, and the next knock gives them back.
//
// Stash, from the receiver: take, or give back.
message Stash {
  repeated string agent_ids = 1;  // at most 16
  bool all = 2;                   // the agents the giver shows, whatever agent_ids says
  // Neither ids nor all: give them back.
}

// MagicView, from the giver: the agents it shows now (what a take takes).
message MagicView {
  repeated string agent_ids = 1;  // at most 16, in the order they are shown
}

enum MagicRole {
  MAGIC_NONE = 0;      // not in the trick, or the trick is off
  MAGIC_GIVER = 1;     // its agents are taken
  MAGIC_RECEIVER = 2;  // it takes them, with a knock
}

enum Corner {
  CORNER_TOP_LEFT = 0;
  CORNER_TOP_RIGHT = 1;
  CORNER_BOTTOM_LEFT = 2;
  CORNER_BOTTOM_RIGHT = 3;
}

// Magic, deck to board: its part in the trick and where its tiles fly.
message Magic {
  MagicRole role = 1;
  bool taken = 2;      // the receiver holds the agents now
  Corner arrive = 3;   // tiles fly in from this corner (the receiver on a take, the giver on a give-back)
  Corner leave = 4;    // and out to this one (the giver on a take, the receiver on a give-back)
}

// ---- usage limits --------------------------------------------------------

// Limits, deck to board: how much of each account's usage is gone, as
// Claude Code and Codex last reported it (docs/protocol.md, "Limits").
message Limits {
  repeated LimitSet sets = 1;
}

// LimitSet is one account in one tool.
message LimitSet {
  Tool tool = 1;
  string account = 2;               // the account's name; "" with one account, and for Codex
  LimitLevel level = 3;             // the worst of its windows (a per-model hit counts as NEAR)
  int64 as_of_ms = 4;               // when the tool last reported
  repeated LimitWindow windows = 5; // the ones to show, the week first
}

message LimitWindow {
  string label = 1;        // "week", "Fable week", "spend"
  uint32 used = 2;         // percent used
  int64 resets_at_ms = 3;  // 0 = not known
  LimitLevel level = 4;
  bool hit = 5;            // the tool said it stopped on this limit
  bool stale = 6;          // it reset since the last report (JSON "reset"): used is not known now
}

enum LimitLevel {
  LIMIT_OK = 0;    // under 80%
  LIMIT_NEAR = 1;  // 80 to 94%
  LIMIT_LOW = 2;   // 95 to 99%
  LIMIT_OUT = 3;   // 100%, or hit
}

// MoveAttention moves an agent on the "Needs you" grid, like Move on the deck.
message MoveAttention {
  string agent_id = 1;
  uint32 slot = 2;  // 1…16
}

// Restore brings back agents lost with the tmux server: the ones listed, or
// every lost agent when agent_ids is empty.
message Restore {
  repeated string agent_ids = 1;
}

// A hat for the agent's working folder (agent_id), or for a folder by path.
message SetHat {
  string agent_id = 1;
  string folder = 2;
  string shape = 3;  // a shape name, or "none"
  string color = 4;  // optional
  bool automatic = 5;  // back to the automatic hat (JSON API: "auto")
}

message ListHats {}
message ListLive {}

message AddLive {
  string session_id = 1;
  int32 slot = 2;  // -1: anywhere
}

message GetState {}

// Continue a Claude session in another account (when one runs out of usage).
message Handoff {
  string agent_id = 1;
  string account = 2;  // AccountList.accounts[].name
}

message ListAccounts {}

// ---- replies ---------------------------------------------------------------

// The outcome of a command, with the web API's status code: 204 done,
// 400 bad request, 403 beyond the board's scope, 404 no such agent, 409 the
// prompt changed, 501 not available, 500 failed.
message Result {
  uint32 code = 1;
  string error = 2;
}

message HatList {
  repeated string shapes = 1;
  repeated string colors = 2;
  repeated HatOverride overrides = 3;
}

message HatOverride {
  string folder = 1;
  string shape = 2;
  string color = 3;
}

message LiveSessions {
  repeated LiveSession sessions = 1;
}

message LiveSession {
  string session_id = 1;
  string title = 2;
  string cwd = 3;
  string folder = 4;
  int64 started_ms = 5;
  bool on_board = 6;
  bool background = 7;
}

// The Claude accounts agents can run in; empty while only one is set up.
message AccountList {
  repeated AccountInfo accounts = 1;
}

message AccountInfo {
  string name = 1;
  string color = 2;
  bool is_default = 3;  // new agents start in it (JSON API: "default")
}

// The prompts queued for an agent, next first: the first few (total says how
// many there are).
message QueueList {
  repeated QueuedPrompt prompts = 1;
  uint32 total = 2;
}

message QueuedPrompt {
  string id = 1;       // send it back in Queue.cancel_id
  string text = 2;     // clipped
  string by = 3;       // who queued it: "mcp:<token>", a device's name, "web" or "local"
  int64 queued_at_ms = 4;
}

message RestoreResult {
  repeated Restored results = 1;
}

message Restored {
  string id = 1;
  string title = 2;
  string action = 3;  // resumed | relaunched | removed | failed
  string error = 4;
}

// ---- pairing and Wi-Fi -----------------------------------------------------

// A certificate signing request for a key the board made itself (EC P-256),
// DER (or PEM). Only an approved board gets a certificate; the deck answers
// CertIssued, or a Result (403 not approved or not over USB, 400 bad request,
// 503 network listener off).
message CertRequest {
  bytes csr = 1;
}

// The board's client certificate and where to use it: the deck's network
// listener (TLS 1.3), host by host (the Mac's .local name first, then its LAN
// addresses) on port.
message CertIssued {
  bytes cert = 1;                // DER, signed by the deck's CA, for the board's key
  bytes ca = 2;                  // DER: the deck's CA, to verify the listener
  repeated string hosts = 3;     // the .local name, then IP addresses
  uint32 port = 4;               // e.g. 7341
  bytes server_fingerprint = 5;  // SHA-256 of the listener's certificate: accepted when
                                 // the host dialled isn't one its names cover
  string device_name = 6;        // the board's name on the deck
  string cert_serial = 7;        // the certificate's serial (hex), as Welcome.cert_serial
}

// Wi-Fi credentials for the board to keep (forget: drop them). Sent by
// `agentctl link wifi` over USB serial only; never stored on the Mac.
message WifiConfig {
  string ssid = 1;
  string password = 2;  // "" for an open network
  bool forget = 3;
}

enum Transport {
  TRANSPORT_UNSPECIFIED = 0;
  TRANSPORT_SERIAL = 1;  // USB serial
  TRANSPORT_WIFI = 2;    // Wi-Fi, TLS 1.3 to the deck's network listener
  TRANSPORT_BLE = 3;     // Bluetooth LE, an encrypted and bonded link (LE Secure Connections, passkey)
}

enum WifiState {
  WIFI_UNSPECIFIED = 0;
  WIFI_UNSUPPORTED = 1;     // this firmware has no Wi-Fi (or no TLS 1.3)
  WIFI_NOT_SET = 2;         // no credentials
  WIFI_IDLE = 3;            // credentials kept, Wi-Fi off (on USB)
  WIFI_JOINING = 4;
  WIFI_CONNECTED = 5;       // joined: ip and rssi are set
  WIFI_WRONG_PASSWORD = 6;
  WIFI_NO_NETWORK = 7;      // the network wasn't found
  WIFI_FAILED = 8;          // another failure
  WIFI_DECK_UNREACHABLE = 9;  // joined, but the deck didn't answer
  WIFI_CERT_REJECTED = 10;  // the deck refused the certificate (revoked): pair again over USB
}

// How the board is connected, for `agentctl link` and `agentctl devices`.
message NetStatus {
  Transport transport = 1;  // the one this frame came over
  WifiState wifi = 2;
  string ssid = 3;
  string ip = 4;            // on Wi-Fi
  int32 rssi = 5;           // dBm, 0 = unknown
  bool has_cert = 6;        // it holds a client certificate
  BleState ble = 7;         // Bluetooth: unset from firmware without it
  Uplink uplink = 8;        // the preference the board holds (LinkConfig)
}

enum BleState {
  BLE_UNSPECIFIED = 0;
  BLE_UNSUPPORTED = 1;  // this firmware has no Bluetooth
  BLE_SETUP = 2;        // no bond: it advertises to anyone and pairs with the passkey on its screen
  BLE_BONDED = 3;       // bonded to a deck, not connected to it now
  BLE_CONNECTED = 4;    // bonded and connected over an encrypted link (whether or not it carries the session)
}

// Which way a board reaches the deck when it isn't on USB. USB always wins
// while a deck answers there.
enum Uplink {
  UPLINK_AUTO = 0;  // Wi-Fi when it works, else Bluetooth
  UPLINK_WIFI = 1;  // Wi-Fi only; Bluetooth only for setup (no Wi-Fi network or certificate yet)
  UPLINK_BLE = 2;   // Bluetooth only; Wi-Fi stays off
}

// The deck's uplink preference for this board, kept across restarts. Sent by
// the deck over any transport; the board answers with a Result (204 kept,
// 501 the firmware has no Bluetooth) and a NetStatus saying what it uses now.
message LinkConfig {
  Uplink uplink = 1;
}

// ---- firmware updates over Wi-Fi -------------------------------------------

// A new firmware for the board, sent by the deck when you update a board on
// Wi-Fi. The board checks that board is its own, downloads the app image
// from path on the deck's network listener (TLS 1.3, its certificate; HTTP
// Range to resume), writes it to its other firmware slot, checks size and
// sha256, restarts into it and keeps it only once it reaches the deck again.
// It answers with FirmwareStatus (REFUSED when it can't take it).
message FirmwareOffer {
  string board = 1;    // the board the image is for (firmware/devices/<board>, e.g. "lilygo-t4-s3")
  string version = 2;  // e.g. "0.2.1": what Hello.firmware says once it runs
  uint64 size = 3;     // the image's size in bytes
  bytes sha256 = 4;    // its SHA-256 (32 bytes)
  string path = 5;     // where to GET it on the network listener: /v1/firmware/{board}/{version}
}

enum FirmwareState {
  FIRMWARE_UNSPECIFIED = 0;
  FIRMWARE_DOWNLOADING = 1;  // percent: how much is written
  FIRMWARE_VERIFYING = 2;    // the image is in; checking it
  FIRMWARE_RESTARTING = 3;   // checked: the board restarts into it now
  FIRMWARE_FAILED = 4;       // error says why; the board keeps its firmware
  FIRMWARE_REFUSED = 5;      // the board won't take this offer (another board's image, on USB, no second slot, busy)
}

// How an update is going, board to deck: after the offer, then every few
// percent while it downloads. The new firmware's Hello (its version) says it
// started; a Hello with the old version after RESTARTING means it went back.
message FirmwareStatus {
  FirmwareState state = 1;
  uint32 percent = 2;  // 0..100
  string error = 3;    // for FAILED and REFUSED
}

// An agent's project (Agent.project): the one whose folder holds its working
// folder, the deepest such folder winning.
message Project {
  string id = 1;
  string name = 2;
}
